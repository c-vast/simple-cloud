# Tomcat
server:
  port: 8080

jwt:
  secret: Kx9#vQ2pL7mZr4tYw8nB1cEf6hJs0dGu3iAo5xNe7qM!
  access-token-expiration: 86400000
  refresh-token-expiration: 2592000000
# Spring
spring:
  application:
    # 应用名称
    name: simple-gateway
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 127.0.0.1:8848
      config:
        # 配置中心地址
        server-addr: 127.0.0.1:8848
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
    gateway:
      routes:
        - id: simple-user
          uri: lb://simple-user
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=2
        - id: simple-auth
          uri: lb://simple-auth
          predicates:
            - Path=/api/auths/**
          filters:
            - StripPrefix=2
        - id: simple-system
          uri: lb://simple-system
          predicates:
            - Path=/api/systems/**
          filters:
            - StripPrefix=2