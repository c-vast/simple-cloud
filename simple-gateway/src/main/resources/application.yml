# Tomcat
server:
  port: 8080

jwt:
  secret: Kx9#vQ2pL7mZr4tYw8nB1cEf6hJs0dGu3iAo5xNe7qM!
  access-token-expiration: 86400000
  refresh-token-expiration: 2592000000
# Spring
spring:
  application:
    # 应用名称
    name: simple-gateway
  profiles:
    # 环境配置
    active: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 127.0.0.1:8848
      config:
        # 配置中心地址
        server-addr: 127.0.0.1:8848
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
    gateway:
      routes:
        - id: simple-user
          uri: lb://simple-user
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=2
        - id: simple-auth
          uri: lb://simple-auth
          predicates:
            - Path=/api/auths/**
          filters:
            - StripPrefix=2
        - id: simple-system
          uri: lb://simple-system
          predicates:
            - Path=/api/systems/**
          filters:
            - StripPrefix=2
# Knife4j 网关聚合配置
knife4j:
  enable: true
  gateway:
    # 开启网关聚合
    enabled: true
    # 使用服务发现模式 (自动从 Nacos 获取)
    strategy: discover
    discover:
      enabled: true
      # 聚合 OpenAPI3 规范 (与微服务端保持一致)
      version: openapi3
      # 排除不需要聚合的服务 (例如网关自己、Nacos等)
      excluded-services:
        - gateway